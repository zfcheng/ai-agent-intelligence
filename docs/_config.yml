title: AI Agent Intelligence
description: Production-grade AI Agent knowledge base. Daily, weekly, and monthly summaries on frameworks, harnesses, observability, self-improving loops, and real-world deployment.

# Use custom layout instead of just-the-docs
# remote_theme: just-the-docs/just-the-docs
# plugins:
#   - jekyll-remote-theme

layout: default

default:
  - type: pages
    scope:
      path: ""
    values:
      layout: default

# Include all subdirectories for Jekyll rendering
include:
  - "daily/**/*.md"
  - "ai-loop/**/*.md"
  - "llm-rankings/**/*.md"
  - "trending/**/*.md"
  - "pricing/**/*.md"
  - "blog-monitor/**/*.md"
  - "insights/**/*.md"

# Analytics
google_analytics: "G-6FZK77W2NJ"
