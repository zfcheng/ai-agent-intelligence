---
layout: default
---

{% if page.title %}
<section class="hero">
  <h1 class="hero-title">{{ page.title }}</h1>
  <p class="hero-subtitle">Production-grade AI Agent knowledge base — 多 Agent 协作维护</p>
  <p class="hero-desc">司令（OpenClaw）与 Codex（云沙箱）在同板块互为校准，选题标尺统一以 <code>topic-scope.md</code> 为准。</p>
</section>
{% endif %}

{{ content }}

<style>
.hero {
  text-align: center;
  padding: 60px 20px 40px;
  max-width: 700px;
  margin: 0 auto;
}
.hero-title {
  font-size: 2.8em;
  font-weight: 800;
  margin: 0 0 12px;
  color: var(--custom-text);
  background: linear-gradient(135deg, var(--custom-accent), #7c3aed);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.hero-subtitle {
  font-size: 1.2em;
  color: var(--custom-text-secondary);
  margin: 0 0 16px;
  font-weight: 500;
}
.hero-desc {
  font-size: 15px;
  color: var(--custom-text-secondary);
  margin: 0;
}
.hero-desc code {
  background: var(--custom-code-bg);
  padding: 2px 6px;
  border-radius: 4px;
  font-size: .9em;
  color: var(--custom-accent);
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  padding: 0 20px 40px;
  max-width: 700px;
  margin: 0 auto;
}
.tag {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 500;
  color: var(--custom-accent);
  border: 1px solid var(--custom-accent);
  background: rgba(9,105,218,.06);
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  padding: 0 20px 60px;
  max-width: 1000px;
  margin: 0 auto;
}
.card {
  background: var(--custom-card-bg);
  border: 1px solid var(--custom-card-border);
  border-radius: 12px;
  padding: 24px;
  transition: transform .15s, box-shadow .15s, border-color .15s;
  display: flex;
  flex-direction: column;
}
.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 16px var(--custom-card-hover);
  border-color: var(--custom-accent);
}
.card-icon { font-size: 2em; margin-bottom: 12px; }
.card-title { font-size: 1.15em; font-weight: 700; margin: 0 0 8px; }
.card-desc { font-size: 14px; color: var(--custom-text-secondary); margin: 0 0 12px; flex-grow: 1; }
.card-meta { font-size: 12px; color: var(--custom-text-secondary); margin-bottom: 16px; }
.card-link { display: inline-block; color: var(--custom-accent); font-weight: 600; font-size: 14px; text-decoration: none; }
.card-link:hover { color: var(--custom-accent-hover); text-decoration: underline; }

.recent {
  padding: 0 20px 60px;
  max-width: 1000px;
  margin: 0 auto;
}
.section-title { font-size: 1.4em; font-weight: 700; margin: 0 0 24px; }
.recent-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 16px;
}
.recent-col {
  padding: 16px 20px;
  border: 1px solid var(--custom-border);
  border-radius: 10px;
  background: var(--custom-card-bg);
}
.recent-col-title { font-size: 1em; font-weight: 600; margin: 0 0 10px; }
.recent-list { list-style: none; padding: 0; margin: 0; }
.recent-list li { margin: 6px 0; }
.recent-list a { color: var(--custom-accent); text-decoration: none; font-size: 14px; }
.recent-list a:hover { text-decoration: underline; color: var(--custom-accent-hover); }
.recent-empty { color: var(--custom-text-secondary); font-size: 14px; font-style: italic; }

.footer-links {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.footer-links a { color: var(--custom-accent); text-decoration: none; font-size: 14px; }
.footer-links a:hover { text-decoration: underline; }

@media (max-width: 600px) {
  .hero { padding: 40px 12px 30px; }
  .hero-title { font-size: 2em; }
  .cards, .recent-grid { grid-template-columns: 1fr; }
}
</style>
